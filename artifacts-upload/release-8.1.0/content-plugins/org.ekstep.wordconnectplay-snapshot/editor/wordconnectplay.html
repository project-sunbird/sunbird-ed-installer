
<div ng-app="org.ekstep.wordconnectplay" ng-controller="mainController" class="ui masthead vertical segment collection-masterhead">
    <div ng-repeat="header in headers" ng-include="header.templateURL" class="header-wrapper"></div>
    
    <div class="ui grid main-body" ng-show="playmode">
        <div class="loading-content loading"></div>
        <div class="ui column" id="contents-pane">
            <div id="playtext" ng-show="showplaynote">
                <span class="playnote">Click on the center word and connect to as many related words as possible</span>
                <button class="ui primary button" id="submit_btn" ng-init="hovering=true" ng-class="{'basic':hovering}"
                        ng-mouseenter="hovering=false"
                        ng-mouseleave="hovering=true" ng-show="showsubmit" ng-click="updateScore()">
                            SUBMIT
                </button>
            </div>
            <canvas id="canvas"></canvas>
        </div>
        
         <div id="infoIcon" class="hide" ng-click="togglesidebar()">
            <!-- <i class="info icon"></i>-->
        </div>
    </div>
   <!-- <div class="ui right demo sidebar playsidebar vertical inverted menu overlay">-->
        <div class="ui card playinfocard hide" >
           
            <div class="content">
                <a class="header">{{title}}</a>
                
                <span id="audioContoler">
                    <i class="announcement icon">
                        <audio controls="" ng-src="{{audio}}"></audio>
                    </i>
                </span>
                <span id="closeinfo" ng-click="closeinfo()">
                    <i class="window close outline icon"></i> 
                </span>
                <div class="meta" ng-show="pos">
                    <a>{{pos}}</a>
                </div>
            </div>
             <div class="ui small image">
                    <img alt="playimage" ng-src="{{playimage}}">
                </div>
             <div class="content">
                <div class="description">
                    {{meaning}}
                </div>
                <ul ng-if="exampleSentences.length == 1">
                    <li ng-repeat="item in exampleSentences">{{item}}</li>
                </ul>
                <ol ng-if="exampleSentences.length > 1">
                    <li ng-repeat="item in exampleSentences">{{item}}</li>
                </ol>
            </div>
            
        </div>
 <!--</div>-->
</div>
