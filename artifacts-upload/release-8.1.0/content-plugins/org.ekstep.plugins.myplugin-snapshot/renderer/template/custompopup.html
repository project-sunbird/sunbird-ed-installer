<div id="Error-popup-model">
    <div class="white-popup">
        <div class="font-lato assess-popup assess-tryagain-popup">
            <div class="wrong-answer" style=" text-align: center;">
                <div class="banner">
                    <img ng-src="assets/icons/banner2.png" height="100%" width="100%" src="assets/icons/banner2.png">
                </div>
                <div class="sign-board"><img ng-src="assets/icons/incorrect.png" width="40%" id="incorrectButton" src="assets/icons/incorrect.png">
                </div>
            </div>
            <div id="popup-buttons-container">
                <div class="left button" id="next-stage">Next</div>
                <div class="right primary button" id="tryagain">Try Again</div>
            </div>
        </div>
    </div>
</div>
<div id="success-model-popup">
    '
    <div class="white-popup">
        <div class="font-lato assess-popup assess-goodjob-popup">
            <div class="correct-answer" style=" text-align: center;">
                <div class="banner"> <img ng-src="assets/icons/banner3.png" height="100%" width="100%" src="assets/icons/banner3.png"> </div>
                <div class="sign-board"> <img ng-src="assets/icons/check.png" id="correctButton" width="40%" src="assets/icons/check.png"> </div>
            </div>
            <div id="popup-buttons-container">
                <div ng-click="hidePopup(); moveToNextStage(" next ");" class="primary center button ng-binding" id="next-stage">Next</div>
            </div>
        </div>
    </div>';
</div>
