<script type="text/ng-template" id="wordpickertemplate">
    <style type="text/css">
    .word-select {
        padding-bottom: 2%;
    }
    
    .word-panel {
        border: 1px solid #EEE;
        height: 40vh;
        overflow-y: auto;
        padding: 2%;
    }
    
    .word-panel.without-border {
        border: none;
    }
    
    .mb10 {
        margin-bottom: 10px;
    }
    
    .ui.grid.mt15 {
        margin-top: 15px;
    }
    
    .custom-checkbox-label {
        border: 1px solid #EEE;
        cursor: pointer;
        display: block;
        padding: 10px;
    }
    
    .ui.checkbox.custom-checkbox {
        margin-top: -32px;
    }
    
    .ui.checkbox .box:before,
    .ui.checkbox label:before,
    .ui.checkbox input[type=checkbox] {
        height: 23px;
        width: 23px;
    }
    
    .ui.checkbox .box:after,
    .ui.checkbox label:after {
        font-size: 18px;
        height: 23px;
        position: absolute;
        top: 2px;
        width: 23px;
    }
    
    .capitalize {
        text-transform: capitalize;
    }
    
    .icon.close {
        cursor: pointer;
    }
    
    .close.red {
        font-size: 2rem;
    }
    
    .ui.label.custom-label {
        background-color: #43B77A;
        border-radius: 25px;
        color: #fff;
        font-size: 1.2rem;
        padding: 10px 20px;
        text-transform: capitalize;
    }
    
    .ui.segment.custom-loader {
        background: #FFF;
        border-radius: 0;
        border: none;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .075);
        margin: 0;
        padding: 0;
        position: static;
    }
    
    .link-text {
        color: #4183C4;
        cursor: pointer;
    }
    
    .word-pos {
        color: #888;
        font-style: italic;
        text-transform: capitalize;
    }
    
    .ngdialog.ngdialog-theme-default .ngdialog-content {
        margin-top: -100%;
    }
    
    .ui.icon.button.custom-button {
        position: relative;
        margin-left: -10%;
        background-color: transparent;
    }
    
    .center-form {
        top: 17vh;
        left: 7vw;
        z-index: 100;
    }
    
    .ui.grid>.column.no-left-padding {
        padding-left: 0;
    }
    </style>
    <div class="wordpicker" class="ui two column horizontally padded grid">
        <div class="twelve wide column">
            <form class="form-horizontal ui form {{isFreshForm ? 'center-form': ''}}" role="form" name="wordForm" id="wordForm" novalidate="novalidate" ng-submit="getWords(wordForm)">
                <div class="row mb10 ">
                    <div class="ui three column grid">
                        <div class="three wide column no-left-padding">
                            <div class="field">
                                <div class="ui fluid  input">
                                    <select id="wordpicker-dropdown" class="ui fluid dropdown" name="language" ng-model="languageSelected" ng-options="lang.code as lang.name for lang in languageList" required="required">
                                        <option value="">
                                            Select Language
                                        </option>
                                    </select>
                                </div>
                                <div class="wizard-error-message" ng-show="wordForm.language.$error.required && inValidForm">
                                    * Please select language !
                                </div>
                            </div>
                        </div>
                        <div class="six wide column">
                            <div class="field">
                                <div class="ui icon fluid input">
                                    <input type="text" name="word" ng-model="word" min="1" placeholder="Search words to add( Eg: Lion, Forest, Run )" required>
                                    <button type="submit" class="ui icon button custom-button">
                                        <i class="search icon"></i>
                                    </button>
                                </div>
                                <div class="wizard-error-message" ng-show="wordForm.word.$error.required && inValidForm">
                                    * Please enter words !
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="ui grid mt15">
                <div class="twelve wide column" ng-hide="showSelectedWords">
                    <div class="ui grid">
                        <div class="row word-panel {{isFreshForm ? 'without-border': ''}}">
                            <div class="twelve wide column">
                                <div class="ui large divided items" ng-show="!isLoading">
                                    <div class="word-select" ng-repeat="wordVal in nameWiseWords">
                                        <div class="row mb10">
                                            <span class="capitalize">{{$index + 1}}. {{wordVal.wordName}}</span>
                                        </div>
                                        <div ng-repeat="wordData in wordVal.words" ng-init="wordIndex = $index">
                                            <label class="custom-checkbox-label" for="{{wordVal.wordName}}{{wordIndex}}">
                                                <span ng-if="wordData.pos " class="word-pos">&nbsp; {{wordData.pos[0]}} : </span>
                                                <span ng-if="wordData.meaning">&nbsp; {{wordData.meaning}}</span>
                                                <span ng-if="!wordData.meaning">&nbsp; Meaning not available.</span>
                                            </label>
                                            <div class="ui checkbox pull-right custom-checkbox">
                                                <input type="checkbox" name="{{wordVal.wordName}}{{$index}} " ng-model="wordData.isSelected " ng-change="toggleWordSelection() " id="{{wordVal.wordName}}{{wordIndex}}">
                                                <label for="wordSel{{wordIndex}}"></label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="ui segment custom-loader" ng-show="isLoading">
                                <div class="ui active inverted dimmer">
                                    <div class="ui text loader">Just one second, We're fetching content for you.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="twelve wide column" ng-show="showSelectedWords">
                    <div class="ui grid">
                        <div class="row word-panel">
                            <div class="eleven wide column">
                                <div class="ui large divided items">
                                    <span class="ui label custom-label" ng-repeat="selWord in selectedWords">{{selWord.lemma}} <i class="icon close" ng-click="removeSelectedWord(selWord.identifier)"></i></span>
                                </div>
                            </div>
                            <div class="one wide column">
                                <i class="pull-right icon close red" ng-click="showSelectedWords = false" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row" ng-show="!isLoading">
                    <div class="twelve wide column">
                        <span class="link-text pull-right" ng-click="showSelectedWords = !showSelectedWords" ng-show="selectedWords.length > 0">{{selectedWords.length}} words selected</span>
                        <span ng-if="selectedWords.length == 0 && nameWiseWords.length > 0" class="pull-right">No Words Selected</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
