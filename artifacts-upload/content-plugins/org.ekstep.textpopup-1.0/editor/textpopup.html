<script type="text/ng-template" ng-app="textpopupapp" ng-controller="textpopupcontroller as $ctrl" id="textpopup">
    <div class="ui modal large active" style="top: 10% !important;">
        <div class="header">
            <div class="ui two column grid">
                <div class="row">
                    <div class="column">
                        <span><i class="file text icon"></i> Text Popup</span>
                    </div>
                    <div class="column" style="text-align: right; cursor: pointer;">
                        <i class="cursor-pointer close icon" ng-click="closeThisDialog()"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="ui mini two steps">
                <div class="active step">
                    <i class="checkmark box icon"></i>
                    <div class="content">
                        <div class="title">Select Text</div>
                        <div class="description">Type or Paste text</div>
                    </div>
                </div>
                <div class="step">
                    <i class="music icon"></i>
                    <div class="content">
                        <div class="title">Add to Lesson</div>
                        <div class="description">Text as a popup add to lesson</div>
                    </div>
                </div>
            </div>
            <div>
                <div class="ui grid container">
                    <div class="two column row">
                        <div class="column">
                            <div class="ui form">
                                <div class="field">
                                    <label>Text</label>
                                    <textarea ng-model="$ctrl.popupText" rows="9" id="popupText" placeholder="Add text here" style="width: 30.5em;"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="column" style="color: #aaa; font-size: 13px; margin-top: 20px;">
                            Text-popup will help you to add text popup and a default toggle button to show and hide text popup to read the text.
                            <br/> Type or Paste the sentence or paragraph to add in the popup.
                            <br/> You can change the font color, font size and popup background color in the Configuration.
                            <br/> Check the preview to verify that it is configured as per your need.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="actions">
            <div class="ui buttons">
                <button class="ui orange button" ng-click="$ctrl.cancel()" type="button">Cancel</button>
                <div class="or"></div>
                <button class="ui blue button" id="addLesson" type="button" ng-click="$ctrl.addTextPopup()" ng-disabled="!$ctrl.popupText">Add To Lesson</button>
            </div>
        </div>
    </div>
