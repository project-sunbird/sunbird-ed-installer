<script type="text/ng-template" ng-app="aksharaEditorapp" ng-controller="aksharaEditorController as $ctrl" id="akshara-editor">
    <style type="text/css">
    .filters-container {
        padding: 8px 10px 4px 18px;
        background: #f1f1f1;
    }
    
    .textWrapper {
        font-size: 26px;
        overflow-x: auto;
        white-space: nowrap;
        background-color: #efefef;
        height: 75px;
        display: flex;
        align-items: center;
    }
    
    .helptext {
        color: #ccc;
    }
    
    .words-div: {
        width: 100%;
    }
    
    .words-list {
        width: 22%;
        float: left;
        margin: 4px;
    }
    
    .panel {
        margin-bottom: 20px;
        background-color: #fff;
        border: 1px solid transparent;
        border-radius: 4px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, .05);
    }
    
    .panel-heading {
        border: 0px;
        color: #000;
        background: #BAD9D4;
        padding: 20px 15px;
    }
    
    .panel-body {
        padding: 15px;
    }
    
    #div1 {
        float: left;
        margin: 10px;
        padding: 10px;
        border: solid 2px;
        border-color: #C0C0C0;
    }
    
    .dragDiv {
        margin: 20px;
    }
    
    .cursor-pointer {
        cursor: pointer;
    }
    
    .errorMsgDiv {
        background: #F26D7D;
        color: white;
        width: 97.2%;
        height: 40px;
        left: 0px;
        position: absolute;
        padding: 10px;
    }
    
    .error-msg {
        color: red;
    }
    </style>
    <div class="ui modal large active" style="top: 10% !important;">
        <div class="content">
            <div class="ui mini four steps">
                <div class="{{$ctrl.isAksharaBrowser ? 'active': ''}} step">
                    <i class="browser icon"></i>
                    <div class="content">
                        <div class="title">Akshara browser</div>
                        <div class="description">Select language and akshara</div>
                    </div>
                </div>
                <div class="{{$ctrl.isWordBrowser ? 'active': ''}} step">
                    <i class="browser icon"></i>
                    <div class="content">
                        <div class="title">Word Browser</div>
                        <div class="description">Selects words</div>
                    </div>
                </div>
                <div class="{{$ctrl.isGameLevel ? 'active': ''}} step">
                    <i class="game icon"></i>
                    <div class="content">
                        <div class="title">Game Level</div>
                        <div class="description">Select and reorder game levels</div>
                    </div>
                </div>
                <div class="step">
                    <i class="game icon"></i>
                    <div class="content">
                        <div class="title">Final</div>
                        <div class="description"></div>
                    </div>
                </div>
            </div>
            <div ng-show="$ctrl.isAksharaBrowser">
                <div class="ui two column horizontally padded grid">
                    <div class="eight wide column">
                        <div class="row" style="margin-bottom: 10px;">
                            <div class="column">
                                <div class="field">
                                    <div class="ui fluid labeled input">
                                        <div class="ui label">Language</div>
                                        <select class="ui fluid dropdown " ng-model="$ctrl.languageSelected" ng-options="lang.code as lang.name for lang in $ctrl.language" ng-change="$ctrl.searchAksharas($ctrl.languageSelected)">
                                            <option value="">
                                                Select Language
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row" style="height: 50vh; overflow-y: scroll; padding-top:20px;">
                            <div class="ui large divided items" ng-show="!$ctrl.isFiltersShown">
                                <div class="words-list select" ng-repeat="akshara in $ctrl.aksharas">
                                    <div class="panel ">
                                        <div class="panel-heading cursor-pointer" ng-click="$ctrl.toggleAksharaSelection(akshara.identifier, akshara) ">
                                            <h4>{{akshara.varna}}</h4>
                                            <span>
                               <i class="fa pull-right fa-lg akshara-select " aria-hidden="true "
                                ng-class="$ctrl.isSelected[akshara.identifier] ? 'checkmark box icon' : 'square outline icon' " >
                             
                                </i>
                                </span>
                                        </div>
                                        <div class="panel-body ">
                                            <!-- <span class="pull-left ">
                                                                                    {{akshara.type}}
                                                                                </span> -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row" style="margin-top: 10px;">
                            <div class="column">
                                <div class="field">
                                    <div class="ui fluid labeled input">
                                        <div class="ui label">Repetition</div>
                                        <input type="number" name="repetition" ng-model="$ctrl.noOfRepetition" min="1">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="four wide column right floated">
                        1. Select the language.</br>
                        2. Select all the Aksharas you want to include in the activity.</br>
                        3. Select no. of repetition.</br>
                        4. Click on Next button.
                    </div>
                </div>
            </div>
            <div ng-show="$ctrl.isWordBrowser">
                <div class="filters-container">
                    <div class="ui form">
                        <div class="ui accordion field">
                            <div class="title" ng-click="$ctrl.showAdvancedFilter = !$ctrl.showAdvancedFilter">
                                <i class="dropdown icon" ng-if="!$ctrl.showAdvancedFilter"></i>
                                <i class="dropdown icon" ng-if="$ctrl.showAdvancedFilter" style="transform: rotate(90deg);"></i> Advanced Filters
                            </div>
                            <div class="content transition {{$ctrl.showAdvancedFilter ? 'visible': 'hidden'}}">
                                <div class="two fields">
                                    <div class="field">
                                        <div class="ui fluid labeled input">
                                            <div class="ui label">Max no. of Alphabets</div>
                                            <input type="number" name="" ng-model="$ctrl.wordSearchText.syllableCount">
                                        </div>
                                    </div>
                                    <div class="field">
                                        <div class="ui fluid labeled input">
                                            <div class="ui label">PoS</div>
                                            <select multiple="multiple" class="ui fluid dropdown" ng-model="$ctrl.wordSearchText.pos" ng-options="type for type in $ctrl.wordTypes">
                                                <option value="">
                                                    Type
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="two fields">
                                    <div class="field">
                                        <label>Speaking complexity</label>
                                    </div>
                                    <div class="field">
                                        <label>Reading complexity</label>
                                    </div>
                                </div>
                                <div class="four fields" style="margin-top: -10px;">
                                    <div class="field">
                                        <div class="ui fluid labeled input">
                                            <div class="ui label">Min</div>
                                            <input type="number" name="" ng-model="$ctrl.wordSearchText.phonologic_complexity.min">
                                        </div>
                                    </div>
                                    <div class="field">
                                        <div class="ui fluid labeled input">
                                            <div class="ui label">Max</div>
                                            <input type="number" name="" ng-model="$ctrl.wordSearchText.phonologic_complexity.man">
                                        </div>
                                    </div>
                                    <div class="field">
                                        <div class="ui fluid labeled input">
                                            <div class="ui label">Min</div>
                                            <input type="number" name="" ng-model="$ctrl.wordSearchText.orthographic_complexity.min">
                                        </div>
                                    </div>
                                    <div class="field">
                                        <div class="ui fluid labeled input">
                                            <div class="ui label">Max</div>
                                            <input type="number" name="" ng-model="$ctrl.wordSearchText.orthographic_complexity.max">
                                        </div>
                                    </div>
                                </div>
                                <div class="fields">
                                    <div class="field">
                                        <button class="ui primary button pull-right" ng-click="$ctrl.getFilterWords()">Apply Filters</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row" style="margin-top: 10px;">
                    <div class="ui column horizontally padded grid">
                        <span class="error-msg" ng-show="$ctrl.lessWordSelected">Selected words per akshara should be atleast {{$ctrl.selectedProperty.repetition}}</span>
                    </div>
                </div>
                <div class="ui two column horizontally padded grid" style="margin-top: 10px;">
                    <div class="eight wide column">
                        <div class="row" style="height: 45vh; overflow-y: scroll; overflow-x: hidden; ">
                            <div class="errorMsgDiv" ng-if="$ctrl.words.length == 0">Words not available !</div>
                            <div class="ui large divided items" ng-show="!$ctrl.isFiltersShown">
                                <div class="words-div select" ng-repeat="word in $ctrl.words">
                                    <!--  <div class="panel ">
                                   <div class="panel-heading ">
                                       <h4>{{word.lemma}}</h4>
                                       <span>
                                                              <i class="fa pull-right fa-lg akshara-select " aria-hidden="true "
                               ng-class="$ctrl.isSelected[word.identifier] ? 'fa-check-square-o' : 'fa-square-o' " ng-click="$ctrl.toggleWordSelection(word.identifier, word) ">
                                                            
                               </i>
                               </span>
                                       <div class="info " ng-if="word.pronunciations.length">
                                           <span class="audio-player ">
                                               <audio controls="controls " >
                                               <source ng-src="{{word.pronunciations[0] | trustUrl}} "/>
                                               </audio>
                                   </span>
                                       </div>
                                   </div>
                                   <div class="panel-body ">
                                       <span class="pull-left " ng-if="word.pos.length ">
                                      {{word.pos[0]}}
                                                                          </span>
                                   </div>
                               </div> -->
                                    <div class="ui grid">
                                        <div class="two wide column">
                                            <h1>{{word.akshara}}</h1>
                                        </div>
                                        <div class="ten wide column">
                                            <div class="row">
                                                <div ng-show="word.isLessWords"><span class="error-msg">Not enough no of words present for this akshara</span></div>
                                                <div class="words-list" ng-repeat="stWord in word.startwords">
                                                    <div class="panel ">
                                                        <div class="panel-heading cursor-pointer" ng-click="$ctrl.toggleWordSelection(stWord.identifier, stWord) ">
                                                            <h4>{{stWord.lemma}}</h4>
                                                            <span>
                                                     <i class="fa pull-right fa-lg akshara-select " aria-hidden="true "
                                                     ng-class="stWord.isSelected ? 'checkmark box icon' : 'square outline icon' " >
                                                      </i>
                                                </span>
                                                            <div class="info " ng-if="stWord.pronunciations.length">
                                                                <span class="audio-player ">
                                                    <!-- <audio controls="controls " >
                                                    <source ng-src="{{stWord.pronunciations[0] | trustUrl}} "/>
                                                    </audio> -->
                                                    </span>
                                                            </div>
                                                        </div>
                                                        <div class="panel-body ">
                                                            <span class="pull-left " ng-if="stWord.pos.length ">
                                                         {{stWord.pos[0]}}
                                                        </span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <!--  <div class="row">
                                               <div class="words-list" ng-repeat=" cntWord in word.containswords">
                                                    <div class="ui red message" ng-show="containswords.length == 0">
                                                        Words are not found
                                                    </div>
                                                   <div class="panel ">
                                                       <div class="panel-heading cursor-pointer" ng-click="$ctrl.toggleWordSelection(cntWord.identifier, cntWord) ">
                                                           <h4>{{cntWord.lemma}}</h4>
                                                           <span>
                                                  <i class="fa pull-right fa-lg akshara-select " aria-hidden="true "
                                                   ng-class="cntWord.isSelected ? 'checkmark box icon' : 'square outline icon' " >
                                                
                                                   </i>
                                               </span>
                                                           <div class="info " ng-if="cntWord.pronunciations.length">
                                                               <span class="audio-player ">
                                                   <audio controls="controls">
                                                   <source ng-src="{{cntWord.pronunciations[0] | trustUrl}} "/>
                                                   </audio>
                                                   </span>
                                                           </div>
                                                       </div>
                                                       <div class="panel-body ">
                                                           <span class="pull-left " ng-if="cntWord.pos.length ">
                                                           {{cntWord.pos[0]}}
                                                       </span>
                                                       </div>
                                                   </div>
                                               </div>
                                           </div> -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="four wide column right floated">
                        1. Select the words for each Akshara. (You need to select at least as many words as the number of repetitions.)</br>
                        2. Click on Next button
                    </div>
                </div>
            </div>
            <div ng-show="$ctrl.isGameLevel">
                <div class="row" style="margin-top: 10px;">
                    <div class="ui column horizontally padded grid">
                        <span class="error-msg" ng-show="$ctrl.noLevelSelected">No Game Level Selected</span>
                    </div>
                </div>
                <div class="ui two column horizontally padded grid">
                    <div class="five wide column">
                        <div id="div1">
                            <div ng-repeat="levelData in $ctrl.levelMetaData track by $index">
                                <div class="dragDiv ui raised segment cursor-pointer" data-id="{{levelData.level}}" x-lvl-draggable="true" x-lvl-drop-target="true" x-on-drop="$ctrl.onLevelDragDrop(dragEl, dropEl)" style="margin-bottom: 10px;">
                                    <input type="checkbox" id="check{{levelData.level}}" name="check{{levelData.level}}" ng-model="levelData.selected" ng-click="$ctrl.addGamelevel(levelData)" />
                                    <label for="check{{levelData.level}}">{{levelData.levelText}}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="seven wide column right floated">
                        <div>
                            <img src="{{$ctrl.selectedLevelPath}}" style="max-width: 500px; padding-left: 20px;">
                        </div>
                        <div><span style="padding-left: 40px; font-weight: bold;">{{$ctrl.selectedLevelText}}</span></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="actions">
            <div class="ui buttons" ng-if="$ctrl.isAksharaBrowser">
                <button class="ui orange button" ng-click="$ctrl.cancel()" type="button">Cancel</button>
                <div class="or"></div>
                <button class="ui blue button" type="button" ng-disabled="$ctrl.selectedAksharas.length == 0" ng-click="$ctrl.getWords()">NEXT</button>
            </div>
            <div class="ui buttons" ng-if="$ctrl.isWordBrowser">
                <button class="ui orange button" ng-click="$ctrl.Editakshara()" type="button">Edit Akshara</button>
                <div class="or"></div>
                <button class="ui blue button" type="button" ng-click="$ctrl.addWords()" ng-disabled="$ctrl.selectedWords.length == 0">Next</button>
            </div>
            <div class="ui buttons" ng-if="$ctrl.isGameLevel">
                <button class="ui orange button" ng-click="$ctrl.EditWord()" type="button">Edit Words</button>
                <div class="or"></div>
                <button class="ui blue button" type="button" ng-disabled="$ctrl.selectedWords.length == 0" ng-click="$ctrl.addtoLesson()">Add to Lesson</button>
            </div>
        </div>
    </div>
